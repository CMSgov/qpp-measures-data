# Required metadata
sonar.organization=cmsgov
sonar.projectKey=qpp-measures-data
sonar.projectName=qpp-measures-data
sonar.projectVersion=1.0
sonar.qualitygate.wait=true
sonar.scm.provider=git
sonar.ci.autoconfig.disabled=true

# Source code location
sonar.sources=./

# Encoding of the source code
sonar.sourceEncoding=UTF-8

# For TypeScript/JavaScript
sonar.javascript.lcov.reportPaths=lcov.info
sonar.typescript.tsconfigPath=tsconfig.json

# Exclusions
# Archived measure scripts are inactive and excluded from analysis entirely.
sonar.exclusions=**/*.spec.ts,**/*.test.ts,**/dist/**,**/node_modules/**,scripts/measures/archive/**

# Rule-specific issue exclusions
sonar.issue.ignore.multicriteria=llmPathTraversal,tsLlmPathTraversal,pythonLlmPathTraversal,dockerInstallScripts,dockerUnpinnedDependencies

# Ignore LLM-specific path traversal findings across all files.
# No LLM integrations or agentic workflows exist in this repository.
sonar.issue.ignore.multicriteria.llmPathTraversal.ruleKey=jssecurity:S8707
sonar.issue.ignore.multicriteria.llmPathTraversal.resourceKey=**/*
sonar.issue.ignore.multicriteria.tsLlmPathTraversal.ruleKey=tssecurity:S8707
sonar.issue.ignore.multicriteria.tsLlmPathTraversal.resourceKey=**/*
sonar.issue.ignore.multicriteria.pythonLlmPathTraversal.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.pythonLlmPathTraversal.resourceKey=**/*

# Accepted package-installation risks in the claims-related image build only.
# Allow installation scripts and unpinned pip/pipenv bootstrap dependencies.
sonar.issue.ignore.multicriteria.dockerInstallScripts.ruleKey=docker:S8541
sonar.issue.ignore.multicriteria.dockerInstallScripts.resourceKey=claims-related/Dockerfile
sonar.issue.ignore.multicriteria.dockerUnpinnedDependencies.ruleKey=docker:S8544
sonar.issue.ignore.multicriteria.dockerUnpinnedDependencies.resourceKey=claims-related/Dockerfile
