name: QPP Measures Data PR CI/Checks
on:
  pull_request:
    types: [opened, synchronize]
    branches: [ master ]


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
      - name: Configure Node version and registry
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Dependencies
        run: npm ci
      - name: Run Tests
        run: npm test
      - name: Version Check
        uses: EndBug/version-check@095362f3cd50f690c8fa0e6afeea81834bd8d320 #v3.0.0
        id: check
      - name: Version Not Updated
        if: steps.check.outputs.changed == 'false'
        run: 'echo "No version change found!"'


